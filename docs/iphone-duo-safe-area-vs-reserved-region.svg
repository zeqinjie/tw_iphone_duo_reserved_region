<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Safe Area 与 Reserved Region 对比</title>
  <desc id="desc">左侧连续内缩的安全边缘，右侧仅在实际占用位置出现的局部矩形。</desc>
  <rect width="1200" height="720" fill="#F7F9FC"/>
  <text x="600" y="77" text-anchor="middle" fill="#172B4D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="34" font-weight="700">Safe Area 与 Reserved Region</text>
  <text x="600" y="111" text-anchor="middle" fill="#53657D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">同一个窗口里的两种不同约束</text>

  <rect x="74" y="142" width="500" height="484" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="2"/>
  <rect x="626" y="142" width="500" height="484" rx="20" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="2"/>
  <text x="324" y="190" text-anchor="middle" fill="#176C84" font-family="PingFang SC, Heiti SC, sans-serif" font-size="25" font-weight="700">Safe Area</text>
  <text x="876" y="190" text-anchor="middle" fill="#B83E48" font-family="PingFang SC, Heiti SC, sans-serif" font-size="25" font-weight="700">Reserved Region</text>

  <!-- Abstract app windows; no device hardware is depicted. -->
  <rect x="175" y="217" width="298" height="317" rx="12" fill="#7892A7"/>
  <rect x="178" y="220" width="292" height="311" rx="9" fill="#F8FCFE"/>
  <rect x="205" y="247" width="238" height="257" rx="5" fill="#14829D"/>
  <rect x="209" y="251" width="230" height="249" rx="2" fill="#E9F6F8"/>
  <text x="324" y="356" text-anchor="middle" fill="#235C70" font-family="PingFang SC, Heiti SC, sans-serif" font-size="21" font-weight="600">内容可用区</text>
  <text x="324" y="385" text-anchor="middle" fill="#527688" font-family="PingFang SC, Heiti SC, sans-serif" font-size="16">沿窗口四边连续内缩</text>
  <text x="324" y="575" text-anchor="middle" fill="#49677A" font-family="PingFang SC, Heiti SC, sans-serif" font-size="17">边缘留出安全距离</text>

  <rect x="727" y="217" width="298" height="317" rx="12" fill="#7892A7"/>
  <rect x="730" y="220" width="292" height="311" rx="9" fill="#F8FCFE"/>
  <rect x="823" y="248" width="106" height="58" rx="6" fill="#D94D59"/>
  <rect x="826" y="251" width="100" height="52" rx="3" fill="#FCE8EA"/>
  <text x="876" y="284" text-anchor="middle" fill="#A32D3B" font-family="PingFang SC, Heiti SC, sans-serif" font-size="16" font-weight="700">占用区域</text>
  <text x="876" y="393" text-anchor="middle" fill="#54687D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20">其余位置不受该矩形约束</text>
  <text x="876" y="565" text-anchor="middle" fill="#A32D3B" font-family="PingFang SC, Heiti SC, sans-serif" font-size="17">只在实际占用位置返回矩形</text>

  <rect x="74" y="644" width="500" height="51" rx="12" fill="#E4F3F6"/>
  <rect x="626" y="644" width="500" height="51" rx="12" fill="#FBECEE"/>
  <text x="324" y="677" text-anchor="middle" fill="#176C84" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" font-weight="700">边缘约束</text>
  <text x="876" y="677" text-anchor="middle" fill="#B83E48" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" font-weight="700">局部几何区域</text>
</svg>
