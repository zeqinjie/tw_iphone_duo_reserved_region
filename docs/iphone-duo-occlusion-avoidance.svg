<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">摄像头遮挡区域的重叠判断与避让</title>
  <desc id="desc">调整前按钮与系统遮挡区域重叠，检测后将按钮移动到不相交的位置。</desc>
  <rect width="1200" height="720" fill="#F7F9FC"/>
  <text x="600" y="76" text-anchor="middle" fill="#172B4D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="34" font-weight="700">遮挡区域：检测重叠后避让</text>
  <text x="600" y="112" text-anchor="middle" fill="#53657D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">根据局部矩形移动业务内容</text>

  <text x="211" y="179" text-anchor="middle" fill="#172B4D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="25" font-weight="700">调整前</text>
  <text x="600" y="179" text-anchor="middle" fill="#172B4D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="25" font-weight="700">重叠判断</text>
  <text x="989" y="179" text-anchor="middle" fill="#172B4D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="25" font-weight="700">调整后</text>

  <rect x="76" y="205" width="270" height="358" rx="14" fill="#7892A7"/>
  <rect x="79" y="208" width="264" height="352" rx="11" fill="#FFFFFF"/>
  <rect x="854" y="205" width="270" height="358" rx="14" fill="#7892A7"/>
  <rect x="857" y="208" width="264" height="352" rx="11" fill="#FFFFFF"/>
  <rect x="154" y="245" width="114" height="61" rx="7" fill="#D94D59"/>
  <rect x="157" y="248" width="108" height="55" rx="4" fill="#F8CCD1"/>
  <rect x="932" y="245" width="114" height="61" rx="7" fill="#D94D59"/>
  <rect x="935" y="248" width="108" height="55" rx="4" fill="#F8CCD1"/>
  <text x="211" y="269" text-anchor="middle" fill="#9F2D3A" font-family="PingFang SC, Heiti SC, sans-serif" font-size="15" font-weight="700">系统遮挡</text>
  <text x="989" y="269" text-anchor="middle" fill="#9F2D3A" font-family="PingFang SC, Heiti SC, sans-serif" font-size="15" font-weight="700">系统遮挡</text>

  <rect x="133" y="280" width="156" height="68" rx="9" fill="#3475C5"/>
  <rect x="136" y="283" width="150" height="62" rx="6" fill="#DCEBFF" fill-opacity="0.91"/>
  <text x="211" y="322" text-anchor="middle" fill="#22599B" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" font-weight="700">操作按钮</text>
  <rect x="176" y="280" width="92" height="26" fill="#E88591" fill-opacity="0.7"/>

  <rect x="362" y="382" width="64" height="4" fill="#8596A8"/>
  <path d="M426 384 l-12 -9 v18 z" fill="#8596A8"/>
  <rect x="445" y="244" width="310" height="280" rx="18" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" fill="#53657D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">比较两个矩形是否相交</text>
  <rect x="463" y="330" width="274" height="58" rx="10" fill="#EEF3F8"/>
  <text x="600" y="365" text-anchor="middle" fill="#273B54" font-family="Menlo, monospace" font-size="15">contentBounds.overlaps(region)</text>
  <text x="600" y="435" text-anchor="middle" fill="#B83E48" font-family="PingFang SC, Heiti SC, sans-serif" font-size="21" font-weight="700">true</text>
  <text x="600" y="470" text-anchor="middle" fill="#53657D" font-family="PingFang SC, Heiti SC, sans-serif" font-size="17">移动按钮到无遮挡位置</text>
  <rect x="774" y="382" width="64" height="4" fill="#8596A8"/>
  <path d="M838 384 l-12 -9 v18 z" fill="#8596A8"/>

  <rect x="987" y="335" width="4" height="49" fill="#3E9A68"/>
  <path d="M989 384 l-8 -11 h16 z" fill="#3E9A68"/>
  <rect x="911" y="401" width="156" height="68" rx="9" fill="#389663"/>
  <rect x="914" y="404" width="150" height="62" rx="6" fill="#E2F5E9"/>
  <text x="989" y="443" text-anchor="middle" fill="#236A45" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" font-weight="700">操作按钮</text>
  <text x="989" y="520" text-anchor="middle" fill="#2E8157" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" font-weight="600">避让成功</text>

  <rect x="242" y="616" width="716" height="67" rx="14" fill="#FFFFFF" stroke="#DFE5EE" stroke-width="2"/>
  <rect x="279" y="637" width="26" height="26" rx="4" fill="#F8CCD1" stroke="#D94D59" stroke-width="2"/>
  <text x="320" y="657" fill="#3D5269" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">系统区域</text>
  <rect x="470" y="637" width="26" height="26" rx="4" fill="#DCEBFF" stroke="#3475C5" stroke-width="2"/>
  <text x="511" y="657" fill="#3D5269" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">业务内容</text>
  <rect x="662" y="637" width="26" height="26" rx="4" fill="#E2F5E9" stroke="#389663" stroke-width="2"/>
  <text x="703" y="657" fill="#3D5269" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18">调整成功</text>
</svg>
